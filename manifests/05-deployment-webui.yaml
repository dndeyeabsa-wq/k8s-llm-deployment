apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm-app
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: llm-config
              key: OLLAMA_BASE_URL
        - name: WEBUI_NAME
          valueFrom:
            configMapKeyRef:
              name: llm-config
              key: WEBUI_NAME
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "3Gi"
            cpu: "1000m"
        volumeMounts:
        - name: webui-storage
          mountPath: /app/backend/data
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: webui-storage
        persistentVolumeClaim:
          claimName: webui-pvc